name: Keep Supabase & Vercel Live

on:
  schedule:
    # Runs at 04:00 UTC every 2 days
    - cron: '0 4 */2 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API
        run: |
          echo "Sending keep-alive ping to Reviewbee..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://reviewbee.vercel.app/api/keep-alive")
          echo "$RESPONSE"

